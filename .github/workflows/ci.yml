# .github/workflows/ci.yml
#
# Continuous integration for crypto-price-fetchers: LP Ranger's.
#
# A `check` job for each Node version the repo supports runs
# `npm run check`, the single gate:
# lint (ESLint, markdownlint, Prettier, actionlint, knip) → the top
# folder's tests, of every part but crypto-price-filler, with 80% line
# coverage
# → crypto-price-filler's tests, with its coverage floor → the security
# audits (npm audit, the security lint, secretlint). It installs the
# repo's packages and crypto-price-filler's, which has its own.
#
# Triggers: every push to main, every pull request to main, and a manual
# run from the Actions tab.

name: CI
run-name: CI on ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    # Each check is named for its role, never its Node version, so moving to
    # newer versions changes only the node-version values below: no check
    # is renamed, and main's required checks stay as they are.
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest

    strategy:
      # Run every version even if one fails, to see the whole picture.
      fail-fast: false
      matrix:
        include:
          # The newest LTS (long-term support) major version of Node.
          - check: check-latest-nodejs-lts
            node-version: "26"
          # The oldest Node the repo supports: two major versions before it.
          - check: check-oldest-nodejs-supported
            node-version: "24"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            fetch-from-any-exchange/crypto-price-filler/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix fetch-from-any-exchange/crypto-price-filler

      - name: Run npm run check (lint + tests + coverage + security audits)
        run: npm run check
